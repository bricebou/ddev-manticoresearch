#ddev-generated
services:
  manticoresearch:
    container_name: ddev-${DDEV_SITENAME}-manticoresearch
    hostname: ${DDEV_SITENAME}-manticoresearch
    # Change the Manticore Search version with:
    #   ddev dotenv set .ddev/.env.manticoresearch --manticoresearch-docker-image=manticoresearch/manticore:25.0.0
    image: ${MANTICORESEARCH_DOCKER_IMAGE:-manticoresearch/manticore:29.9.0}
    restart: "no"
    environment:
      - EXTRA=1
      - VIRTUAL_HOST=$DDEV_HOSTNAME
    external_links:
      - ddev-router:${DDEV_SITENAME}.${DDEV_TLD}
    labels:
      com.ddev.approot: $DDEV_APPROOT
      com.ddev.site-name: ${DDEV_SITENAME}
    ports:
      - 9306
      - 9308
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    volumes:
      - manticoresearch:/var/lib/manticore
      - ./manticoresearch/manticore.conf:/etc/manticoresearch/manticore.conf
volumes:
  manticoresearch:
    name: ddev-${DDEV_SITENAME}-manticoresearch
